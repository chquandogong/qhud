[package]
name = "qhud"
version = "0.5.2"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Ambient desktop HUD for AI CLI sessions — a glanceable, always-on-desktop second frontend for qmonster"
repository = "https://github.com/chquandogong/qhud"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tauri-plugin-single-instance = "2"
# Observe pipeline is reused wholesale from the qmonster TUI. Pinned to
# the exact rev this bridge was written against; bump deliberately and
# re-run the contract tests in src/view.rs when you do.
qmonster = { git = "https://github.com/chquandogong/qmonster", rev = "6a21c447f41dd366e6ea7e08fb3e8545a03396d5" }
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "charset"] }
# process/io-util/time: the codex app-server fallback speaks JSON-RPC to
# a short-lived child over stdio with a timeout.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "process", "io-util", "time"] }
# Same gtk tauri/tao already link — the frame guard hashes a strip of the
# widget's own window to catch presentation freezes (see frame_guard.rs).
gtk = "0.18"

[profile.release]
strip = true
lto = true
codegen-units = 1
