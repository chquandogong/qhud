<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">qhud — AI usage. At a glance.</title>
  <desc id="desc">A desktop companion for usage, reset times, and sessions on Linux and Windows. An abstract illustration shows the three supported providers: Claude Code, Codex, and Antigravity.</desc>
